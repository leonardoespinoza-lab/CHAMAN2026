name: quality-gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "codex/**"
      - "staging/**"

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  topology-and-secrets:
    name: topology-and-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-deployment-topology.js
      - run: node scripts/audit-config-secrets.js
      - run: node scripts/audit-sensitive-logs.js
      - run: node scripts/test-soja-recso-matrix.js

  core-tests:
    name: test-${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [sdc-datos, sdc-api-clima, sdc-api-predicciones, sdc-websocket]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - working-directory: ${{ matrix.service }}
        run: npm ci
      - working-directory: ${{ matrix.service }}
        run: npm test -- --runInBand
      - working-directory: ${{ matrix.service }}
        run: npm run build

  frontend:
    name: frontend-production-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdc-app-chaman/package-lock.json
      - working-directory: sdc-app-chaman
        run: npm ci --legacy-peer-deps
      - working-directory: sdc-app-chaman
        run: npm run build

  satellite-worker:
    name: satellite-worker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sdc-ndvi-worker/requirements.txt
      - working-directory: sdc-ndvi-worker
        run: pip install -r requirements.txt
      - working-directory: sdc-ndvi-worker
        run: python -m py_compile worker.py calcular_ndvi.py recorte.py storage.py config.py geo.py health.py cleaner.py
