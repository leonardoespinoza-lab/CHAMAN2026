apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdc-api-predicciones
  labels:
    app: sdc-api-predicciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdc-api-predicciones
  template:
    metadata:
      labels:
        app: sdc-api-predicciones
    spec:
      containers:
      - name: sdc-api-predicciones
        image: chaman/sdc-api-predicciones:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        - name: API_DATOS
          value: "http://sdc-datos-service"
        - name: ENV
          value: "production"
        - name: API_CLIMA
          value: "http://sdc-api-clima-service"
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: sdc-api-predicciones-service
  labels:
    app: sdc-api-predicciones
spec:
  selector:
    app: sdc-api-predicciones
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
  type: ClusterIP
