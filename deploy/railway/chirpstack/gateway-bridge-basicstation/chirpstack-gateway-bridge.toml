[general]
log_level=4
log_json=true

[backend]
type="basic_station"

  [backend.basic_station]
  bind="0.0.0.0:3001"
  tls_cert="/run/chaman-basicstation/server.crt"
  tls_key="/run/chaman-basicstation/server.key"
  ca_cert="/run/chaman-basicstation/ca.crt"
  stats_interval="30s"
  ping_interval="1m0s"
  read_timeout="1m5s"
  write_timeout="1s"
  region="AU915"
  frequency_min=915000000
  frequency_max=928000000

  [[backend.basic_station.concentrators]]
    [backend.basic_station.concentrators.multi_sf]
    frequencies=[
      916800000,
      917000000,
      917200000,
      917400000,
      917600000,
      917800000,
      918000000,
      918200000,
    ]

    [backend.basic_station.concentrators.lora_std]
    frequency=917500000
    bandwidth=500000
    spreading_factor=8

[integration]
marshaler="protobuf"

  [integration.mqtt]
  event_topic_template="au915_1/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
  state_topic_template="au915_1/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
  command_topic_template="au915_1/gateway/{{ .GatewayID }}/command/#"
  state_retained=true
  keep_alive="30s"
  max_reconnect_interval="1m0s"
  terminate_on_connect_error=false

    [integration.mqtt.auth]
    type="generic"

      [integration.mqtt.auth.generic]
      servers=["tcp://chirpstack-mqtt.railway.internal:1883"]
      username=""
      password=""
      qos=0
      clean_session=true
      # Mosquitto requires a non-empty ID. Keep it non-EUI64 so the bridge
      # publishes each Basic Station connection under the real gateway EUI.
      client_id="cgb-au915-1"
