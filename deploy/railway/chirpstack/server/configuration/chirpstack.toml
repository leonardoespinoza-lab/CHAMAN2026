[logging]
level="info"
json=true

[postgresql]
dsn="$CHIRPSTACK_POSTGRES_DSN"
max_open_connections=10
min_idle_connections=0

[redis]
servers=["$CHIRPSTACK_REDIS_URL"]
tls_enabled=false
cluster=false

[network]
net_id="000000"
enabled_regions=["au915_0"]

[api]
bind="0.0.0.0:8080"
secret="$CHIRPSTACK_API_SECRET"

[integration]
enabled=["mqtt"]

  [integration.mqtt]
  server="tcp://$MQTT_BROKER_HOST:1883/"
  username="chirpstack"
  password="$MQTT_CHIRPSTACK_PASSWORD"
  json=true
