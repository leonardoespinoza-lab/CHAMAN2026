apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdc-ndvi-worker
  namespace: chaman
  labels:
    app: sdc-ndvi-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sdc-ndvi-worker
  template:
    metadata:
      labels:
        app: sdc-ndvi-worker
    spec:
      containers:
      - name: ndvi-worker
        image: chaman/sdc-ndvi-worker:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: host
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: port
        - name: REDIS_DB
          value: "0"
        - name: API_EXTERNA_URL
          value: "http://sdc-api-externa-service"
        - name: ENV
          value: "production"
        - name: ENVIAR_BACKEND
          value: "true"
        - name: CLEAN_UP
          value: "true"
        - name: LOCAL_NDVI_PATH
          value: "/app/ndvi-output"
        volumeMounts:
        - name: ndvi-output
          mountPath: /app/ndvi-output
        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "500m"
      - name: ndvi-static
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: ndvi-output
          mountPath: /app/ndvi-output
          readOnly: true
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: ndvi-output
        hostPath:
          path: /var/lib/chaman-ndvi
          type: DirectoryOrCreate
      - name: nginx-config
        configMap:
          name: ndvi-nginx-config
