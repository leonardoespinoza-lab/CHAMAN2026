server {
    # Railway expone el puerto declarado por PORT (8080 en los entornos
    # CHAMAN). Mantenerlo explicito evita despliegues saludables que luego
    # responden 502 porque el router y Nginx escuchan puertos distintos.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Web App Manifest
    location ~* \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Se genera en cada arranque con las URLs del entorno. Nunca debe quedar
    # cacheado, porque podria conservar endpoints de otro ambiente.
    location = /runtime-config.js {
        default_type application/javascript;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # El bootstrap usa una extension fuera de los patrones cacheados por el
    # service worker. Se conserva runtime-config.js para clientes anteriores.
    location = /runtime-config.bootstrap {
        default_type application/javascript;
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # Imágenes NDVI (almacenamiento local compartido con el worker)
    location /ndvi/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Referencias fenologicas fotorrealistas
    location ~* \.webp$ {
        types { image/webp webp; }
        default_type image/webp;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
