apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdc-app-chaman
  namespace: chaman
  labels:
    app: sdc-app-chaman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdc-app-chaman
  template:
    metadata:
      labels:
        app: sdc-app-chaman
    spec:
      containers:
      - name: sdc-app-chaman
        image: docker.io/chaman/sdc-app-chaman:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: ndvi-output
          mountPath: /usr/share/nginx/html/ndvi
      volumes:
      - name: ndvi-output
        hostPath:
          path: /var/lib/chaman-ndvi
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sdc-app-chaman-service
  namespace: chaman
  labels:
    app: sdc-app-chaman
spec:
  selector:
    app: sdc-app-chaman
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: ClusterIP
