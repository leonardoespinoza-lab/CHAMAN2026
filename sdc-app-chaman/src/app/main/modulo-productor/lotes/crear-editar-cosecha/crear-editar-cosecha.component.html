<div style="padding: 1em; height: 100%">
  <div class="p-card" style="height: 100%; overflow: auto">
    <!-- Header -->
    <div class="p-card-header" style="display: flex; justify-content: center">
      <img src="images/cosecha.jpg" alt="" />
    </div>

    <!-- Body -->
    <div
      class="p-card-body"
      style="height: 100%; display: flex; flex-direction: column; justify-content: space-between"
    >
      <div style="overflow: hidden; height: 100%">
        <!-- Titulo -->
        <div class="p-card-title">{{ titulo?.() }}</div>
        <!-- Subtitulo -->
        @if (lote) {
          <div class="p-card-subtitle">{{ 'Lote' | translate }} {{ lote.nombre }}</div>
        }
        <!-- Content -->
        <div class="p-card-content" style="overflow: auto; height: calc(100% - 26px); margin-top: 1em">
          @if (form) {
            <form [formGroup]="form">
              <!-- Fecha de cosecha -->
              <p-floatlabel variant="in" class="mb-4">
                <p-datepicker
                  formControlName="fechaCosecha"
                  showIcon
                  iconDisplay="input"
                  [fluid]="true"
                  [showButtonBar]="true"
                />
                <label>{{ 'Fecha de cosecha' | translate }}</label>
              </p-floatlabel>

              <!-- Rendimiento -->
              <p-floatlabel variant="in" class="mb-4">
                <p-inputnumber formControlName="rendimientoObtenidoKgHa" [min]="0" [fluid]="true" suffix=" Kg/Ha" />
                <label>{{ 'Rendimiento' | translate }}</label>
              </p-floatlabel>

              <!-- Humedad -->
              <p-floatlabel variant="in" class="mb-4">
                <p-inputnumber formControlName="humedadCosecha" [min]="0" [max]="100" [fluid]="true" suffix="%" />
                <label>{{ 'Humedad' | translate }}</label>
              </p-floatlabel>
            </form>
          }
        </div>
      </div>
      <!-- Footer -->
      <div class="p-card-footer">
        <p-divider />
        <div class="flex gap-4 mt-1">
          <p-button
            [label]="'Cancelar' | translate"
            severity="secondary"
            class="w-full"
            [outlined]="true"
            styleClass="w-full"
            (onClick)="volver()"
          />
          <p-button
            [label]="'Guardar' | translate"
            class="w-full"
            styleClass="w-full"
            [loading]="loading"
            (onClick)="guardar()"
            [disabled]="!form?.valid"
          />
        </div>
      </div>
    </div>
  </div>
</div>
