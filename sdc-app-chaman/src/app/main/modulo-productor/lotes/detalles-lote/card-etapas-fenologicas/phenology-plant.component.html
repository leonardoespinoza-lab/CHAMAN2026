<figure
  class="botanical-shell"
  [class]="'botanical-shell crop-' + cultivoAssetKey + ' phase-' + fase"
  [class.is-current]="actual"
>
  <div class="specimen-halo" aria-hidden="true"></div>
  <img class="specimen-photo" [src]="assetPath" [alt]="assetAlt" loading="lazy" decoding="async" draggable="false" />
  <span class="specimen-baseline" aria-hidden="true"></span>
</figure>
