@if (combinedChart && metricCharts.length > 0) {
  <article class="soil-chart-card soil-chart-card-combined">
    <header>
      <div>
        <span>{{ titulo || 'Perfil Sentek' }}</span>
        <strong>Curvas combinadas por profundidad</strong>
      </div>
      <small>Humedad / salinidad / temperatura</small>
    </header>
    <app-chart [options]="combinedChart"></app-chart>
  </article>

  <div class="soil-chart-grid">
    @for (chart of metricCharts; track chart.key) {
      <article class="soil-chart-card">
        <header>
          <div>
            <span>{{ chart.title }}</span>
            <strong>{{ chart.summary }}</strong>
          </div>
          <small>{{ chart.unit }}</small>
        </header>
        <app-chart [options]="chart.options"></app-chart>
      </article>
    }
  </div>
} @else {
  <div class="sin-datos">
    <p-message severity="info" [text]="'No hay datos disponibles para mostrar el perfil' | translate"></p-message>
  </div>
}
