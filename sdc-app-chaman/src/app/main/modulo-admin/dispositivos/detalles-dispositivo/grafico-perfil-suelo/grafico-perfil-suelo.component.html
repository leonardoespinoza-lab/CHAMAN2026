@if (chartOptions && datos.length > 0) {
  <div id="chartContainer" class="chart-container">
    <app-chart [options]="chartOptions"></app-chart>
  </div>
} @else {
  <div class="sin-datos">
    <p-message severity="info" [text]="'No hay datos disponibles para mostrar el perfil' | translate"></p-message>
  </div>
}
