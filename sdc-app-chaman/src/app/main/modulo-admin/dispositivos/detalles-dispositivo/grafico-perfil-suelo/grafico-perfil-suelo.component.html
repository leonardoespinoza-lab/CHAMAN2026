@if (combinedChart && metricOptions.length > 0) {
  <article class="soil-chart-card soil-chart-card-combined">
    <header>
      <div>
        <span>{{ titulo || 'Perfil Sentek' }}</span>
        <strong>{{ metricSummary }}</strong>
      </div>

      <div class="soil-chart-actions">
        <select
          class="soil-chart-filter"
          [ngModel]="selectedMetric"
          (ngModelChange)="onMetricChange($event)"
          aria-label="Variable de suelo"
        >
          @for (option of metricOptions; track option.value) {
            <option [ngValue]="option.value">{{ option.label }}</option>
          }
        </select>
        <button class="soil-chart-export" type="button" (click)="exportarCsv()">
          Exportar CSV
        </button>
      </div>
    </header>

    <app-chart [options]="combinedChart"></app-chart>
  </article>
} @else {
  <div class="sin-datos">
    <p-message severity="info" [text]="'No hay datos disponibles para mostrar el perfil' | translate"></p-message>
  </div>
}
