<!-- El contenedor principal usa tu clase global 'custom-card' y flexbox para la estructura interna. -->
<div class="custom-card flex flex-col h-full">
  <!-- 1. Encabezado de la Tarjeta -->
  <div class="row-flex-start" style="gap: 0.5em; height: 28px">
    <!-- Título de la tarjeta, usando tu clase 'titulo-card' -->
    <div class="titulo-card row-space-around w-full" style="gap: 0.5em">
      <span>{{ 'Profundidad' | translate }}</span>
      <!-- Valor de la profundidad -->
      <span class="text-lg font-semibold">{{ data.profundidad }} cm</span>
    </div>
  </div>

  <!-- 2. Cuerpo de la Tarjeta -->
  <!-- 'flex-grow' hace que este div ocupe el espacio vertical disponible -->
  <div class="flex flex-col justify-center flex-grow">
    <p-divider class="my-2" />

    @if (data) {
      <!-- Contenedor para ambas mediciones, usando tu helper class 'row-space-around' -->
      <div class="row-space-around text-center">
        <!-- Medición de Humedad -->
        <div class="column-center">
          <span class="text-sm font-light text-surface-500">{{ 'Humedad' | translate }}</span>
          <span class="text-3xl font-bold">
            {{ data.humedad.actual | number: '1.1-1' }}
            <span class="text-xl font-semibold">{{ data.humedad.unidad }}</span>
          </span>
        </div>

        <!-- Medición de Temperatura -->
        <div class="column-center">
          <span class="text-sm font-light text-surface-500">{{ 'Temperatura' | translate }}</span>
          <span class="text-3xl font-bold">
            {{ data.temperatura.actual | number: '1.1-1' }}
            <span class="text-xl font-semibold">{{ data.temperatura.unidad }}</span>
          </span>
        </div>
      </div>
    } @else {
      <p-message
        class="custom-message"
        severity="info"
        [text]="'Sin datos para esta profundidad' | translate"
      ></p-message>
    }

    <p-divider class="my-2" />
  </div>
</div>
